plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '2.4'
    }

    // A fixed key, so a new build installs over the previous one. It comes from environment variables that the
    // GitHub workflow fills from repository secrets; nothing secret is in this repository. Without them (a local
    // build, or a build run for someone else's fork) the release is signed with the debug key as before.
    def tvKeystore = System.getenv('TV_KEYSTORE_FILE')
    if (tvKeystore) {
        signingConfigs {
            tvRelease {
                storeFile file(tvKeystore)
                storePassword System.getenv('TV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TV_KEY_ALIAS') ?: 'tv'
                keyPassword System.getenv('TV_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: the fixed key when the workflow provides it, else the debug key.
            signingConfig tvKeystore ? signingConfigs.tvRelease : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is not available on the JVM; the weather parser's tests need a real one.
    testImplementation 'org.json:json:20240303'
}
